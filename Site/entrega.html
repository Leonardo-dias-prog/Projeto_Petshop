<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrega - Heros Pet</title>
  <link rel="icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"><link rel="stylesheet" href="paginas.css">
  <style>
    .info { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .tag { background: var(--azul); color: #fff; padding: 8px 16px; border-radius: 12px; font-family: "Lilita One", Arial; text-align: center; }
    .etapas { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .etapa { flex: 1; min-width: 130px; text-align: center; font-family: "Lilita One", Arial; }
    .bola { width: 70px; height: 70px; border-radius: 50%; margin: 10px auto; display: flex; align-items: center; justify-content: center; font-size: 30px; background: var(--laranja-claro); }
    .feita .bola { background: var(--azul); }
    .status { display: inline-block; font-size: 13px; padding: 6px 10px; border-radius: 10px; background: var(--laranja-claro); color: #fff; }
    .feita .status { background: var(--azul); }
    .rodape-entrega { display: flex; justify-content: space-between; margin-top: 14px; flex-wrap: wrap; gap: 10px; }
  </style>
</head>
<body>
  <header class="cabecalho">
    <a href="index.html" class="logo">Heros Pet</a>
    <input type="search" class="busca" placeholder="Para seu pet, você encontra aqui">
    <nav class="icones">
      <a href="entrega.html" title="Entrega">🚚</a>
      <a href="carrinho.html" title="Carrinho">🛒</a>
      <a href="atendimento.html" title="Atendimento">🎧</a>
      <a href="login.html" title="Perfil">👤</a>
      <a href="favoritos.html" title="Favoritos">⭐</a>
    </nav>
  </header>
  <main class="painel">
    <h2 class="rotulo">Entrega</h2>
    <div id="pedidos"></div>
    <div class="rodape-entrega"><a class="btn" href="atendimento.html">📞 Ajuda</a></div>
  </main>
  <script src="dados.js"></script>
  <script>
    const etapas = [["Pagamento", "💸"], ["Separando pedido", "📦"], ["Enviado ao Correio", "📬"], ["Entregando pedido", "🚚"], ["Entregue!", "🏠"]];
    function desenhar() {
      const box = document.getElementById("pedidos");
      if (!usuarioAtual()) return box.innerHTML = '<p class="card">Entre na sua conta para ver seus pedidos. <a href="login.html"><u>Ir para o login</u></a></p>';
      const peds = getPedidos().slice().reverse();
      if (!peds.length) return box.innerHTML = '<p class="card">Você ainda não fez nenhum pedido. Finalize uma compra no <a href="carrinho.html"><u>carrinho</u></a>.</p>';
      box.innerHTML = peds.map(p => {
        const f = etapaDoPedido(p), prev = new Date(p.criadoEm + 7 * 864e5).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
        return `<h3>Pedido Nº ${p.numero} - ${moeda(p.total)}</h3>
          <div class="info"><span class="tag">Entrega prevista para:<br>${prev}</span><span class="tag">Etapas realizadas: ${f}/5</span></div>
          <div class="card etapas">${etapas.map((e, i) => `<div class="etapa ${i < f ? "feita" : ""}">${e[0]}<div class="bola">${e[1]}</div>
          <span class="status">Etapa ${i + 1}<br>${i < f ? "Realizada!" : "Em andamento"}</span></div>`).join("")}</div>`;
      }).join("");
    }
    desenhar(); setInterval(desenhar, 15000);
  </script>
</body>
</html>
